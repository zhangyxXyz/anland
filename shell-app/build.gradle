// Anland shell (launcher) for Droidspaces containers. Compose presents the UI;
// local privileged work goes through `su -c` + the droidspaces CLI, while SSH
// connections authenticate directly from the APK. Window hosting lives in
// the anland daemon and the com.anlandnext host APK (auto-attach).
//
// Signing comes from the repository's private keystore/ configuration in local
// builds and the matching Actions Secrets in CI.
plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
}

android {
    packaging {
        resources.excludes += ['META-INF/versions/**/OSGI-INF/MANIFEST.MF']
    }
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }
    namespace 'com.anland.shell'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anland.shell'
        minSdk 28
        targetSdk 28
        testInstrumentationRunner 'com.anland.shell.ui.IconInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs { release {} }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    // Tests run against the actual signed release on the tablet, with Android's
    // Bitmap/Canvas and normal application/font initialization.
    testBuildType 'release'

    lint {
        // Sideloaded root tool — never distributed via Google Play; targetSdk 28
        // is deliberate (legacy shortcut/pinning semantics).
        disable 'ExpiredTargetSdkVersion'
    }
}

ext.anlandComponent = 'SHELL'
def appearanceAssets = tasks.register('prepareAppearanceAssets', Sync) {
    from('../module') { include 'appearance.sh' }
    into(layout.buildDirectory.dir('generated/appearance-assets'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/appearance-assets'))
tasks.named('preBuild').configure { dependsOn(appearanceAssets) }

apply from: '../gradle/component-version.gradle'
apply from: '../gradle/component-signing.gradle'

dependencies {
    implementation project(':ui-common')
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.github.mwiede:jsch:2.28.7'
    // JSch uses the lightweight BC implementations for Ed25519/Curve25519 on
    // Android, without replacing Android's system cryptography provider.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
}

// Same Kotlin 2.2 / lint compatibility exclusions as MaterialDesignTmpl.
// These detectors crash in the analysis API; keep all other checks enabled.
android.lint {
    disable += ['NullSafeMutableLiveData', 'RememberInComposition',
                'FrequentlyChangingValue', 'AutoboxingStateCreation']
}
