pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
// Single-module gradle project: root project IS the application (same layout
// convention as the anland repo's app/). Zero third-party dependencies —
// all privileged work goes through `su -c` + the droidspaces CLI.
rootProject.name = "anland-shell"

include ':ui-common'
project(':ui-common').projectDir = file('../ui-common')
