// Single-module gradle project: root project IS the application. Pure Java
// APK — all rendering/protocol lives in the root daemon (waylandbridge), so
// there are no dependencies and no native libs. Signing uses debug.keystore
// (gitignored; the Makefile bootstraps it with keytool when missing) so
// release APKs stay installable over previous dev builds.
plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
}

android {
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }
    namespace 'com.anlandnext'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anlandnext'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'anland'
            keyAlias 'anland'
            keyPassword 'anland'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        // Sideloaded root tool — never distributed via Google Play; targetSdk 29
        // is deliberate (legacy surface/popup semantics).
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // Window management (list/events/attach/close) goes through the same
    // library shipped to third-party apps; the daemon scopes by identity —
    // this APK is package-authenticated and sees every window.
    implementation project(':libawl')
}

dependencies {
    implementation project(':ui-common')
}

// Same Kotlin 2.2 / lint compatibility exclusions as MaterialDesignTmpl.
// These detectors crash in the analysis API; keep all other checks enabled.
android.lint {
    disable += ['NullSafeMutableLiveData', 'RememberInComposition',
                'FrequentlyChangingValue', 'AutoboxingStateCreation']
}
