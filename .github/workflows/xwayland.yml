name: Xwayland ARM64
on:
  push:
    branches: [dev]
    paths: ['patches/xwayland/**', '.github/workflows/xwayland.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  xwayland:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates meson ninja-build build-essential gh patch
          apt-get build-dep -y xwayland
      - uses: actions/checkout@v4
      - name: Build pinned Xwayland with compatibility fixes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init third_party/xserver
          cd third_party/xserver
          patch -p1 < ../../patches/xwayland/anland-kgsl-glamor.patch
          meson setup build -Dxvfb=false -Dxwayland_ei=false
          meson compile -C build -j 4
          mkdir -p ../../release
          cp build/hw/xwayland/Xwayland ../../release/Xwayland
          cd ../../release
          sha256sum Xwayland > SHA256SUMS
      - name: Upload to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="xwayland-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Xwayland ARM64 input fix" --notes "Pinned Xwayland with KGSL and touch target fixes; Debian 13 ARM64. Source: $GITHUB_SHA"
          gh release upload "$tag" release/Xwayland release/SHA256SUMS
