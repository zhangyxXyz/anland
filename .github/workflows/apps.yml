name: Android apps

# Reuse the exact signing caches from build.yml. The optional native build
# publishes the daemon alongside the apps without rebuilding rootfs/audio.
# Everything goes directly to a draft Release, without Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      native:
        description: Also build the native Wayland daemon
        type: boolean
        default: false
      native_only:
        description: Build only the native daemon (reuse the already installed APK)
        type: boolean
        default: false
      native_debug:
        description: Also publish a separate native daemon with frame tracing
        type: boolean
        default: false
  push:
    branches: [dev]
    paths: ['.github/workflows/apps.yml']

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        if: inputs.native_only != true
        with:
          path: app/debug.keystore
          key: anland-debug-keystore-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: inputs.native_only != true
        with:
          path: debug.keystore
          key: anland-shell-signing-v1
          fail-on-cache-miss: true
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.native_only != true
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
          key: android-29.0.13113456-36.0.0-android-36
      - name: Install pinned Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
      - name: Prepare native build tools
        if: inputs.native == true || inputs.native_only == true
        run: |
          set -euo pipefail
          git submodule update --init third_party/libffi third_party/wayland
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config m4 patch
          curl -fsSL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz \
            | tar xz --strip-components=1 -C third_party/libffi
          test -x third_party/libffi/configure
          meson setup /tmp/wl-scanner third_party/wayland \
            -Dscanner=true -Dlibraries=false -Ddocumentation=false \
            -Dtests=false -Ddtd_validation=false
          ninja -C /tmp/wl-scanner
          sudo install -m755 /tmp/wl-scanner/src/wayland-scanner /usr/local/bin/wayland-scanner
      - name: Window geometry and desktop metadata regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/anland-java-tests
          javac -d /tmp/anland-java-tests \
            app/libawl/src/main/java/com/anlandnext/awl/WindowSafeArea.java tests/WindowSafeAreaTest.java
          java -cp /tmp/anland-java-tests com.anlandnext.awl.WindowSafeAreaTest
          g++ -std=c++17 -Wall -Wextra -Werror -I services/waylandbridge \
            services/waylandbridge/desktop_metadata.cpp tests/desktop_metadata_test.cpp \
            -o /tmp/anland-metadata-test
          /tmp/anland-metadata-test
      - name: Build and lint both apps
        if: inputs.native_only != true
        run: |
          set -euo pipefail
          cp debug.keystore shell-app/debug.keystore
          (cd app && bash gradlew assembleRelease lintRelease --console=plain)
          (cd shell-app && bash gradlew assembleRelease assembleReleaseAndroidTest lintRelease --console=plain)
          mkdir release
          cp app/build/outputs/apk/release/*.apk release/anland-wayland.apk
          cp shell-app/build/outputs/apk/release/*.apk release/anland-shell.apk
          cp shell-app/build/outputs/apk/androidTest/release/*.apk release/anland-shell-tests.apk
      - name: Build native daemon
        if: inputs.native == true || inputs.native_only == true
        run: |
          set -euo pipefail
          make libffi native
          mkdir -p release
          cp build/waylandbridge release/waylandbridge
          if [ '${{ inputs.native_debug }}' = 'true' ]; then
            make native-debug
            cp build/waylandbridge-debug release/waylandbridge-debug
          fi
      - name: Verify upgrade certificates
        if: inputs.native_only != true
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --print-certs release/anland-wayland.apk | grep -F '1968c96b5773b7b9b9d3d24adfa52c09103d203db3a22068b8abfeff17d9253e'
          "$signer" verify --print-certs release/anland-shell.apk | grep -F 'a04e344292b897de1b9cbe013683c42c9d7009dadc770774e6c0a70191051cf6'
      - name: Upload directly to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release && sha256sum * > ../SHA256SUMS)
          mv SHA256SUMS release/SHA256SUMS
          printf 'Anland runtime build. Source: %s\nNative only: %s\n' "$GITHUB_SHA" '${{ inputs.native_only }}' > release-notes.md
          tag="anland-apps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Anland apps $GITHUB_RUN_ID" --notes-file release-notes.md
          gh release upload "$tag" release/*
