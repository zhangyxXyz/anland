name: Anland release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_shell:
        description: Build Shell APK and test APK
        type: boolean
        default: true
      build_wayland:
        description: Build Wayland APK, AAR, native daemon and Root module
        type: boolean
        default: true
      build_rootfs:
        description: Build ARM64 RootFS with integrated desktop and Xwayland fixes
        type: boolean
        default: false

      rootfs_target:
        description: RootFS distribution (when RootFS is selected)
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-26
          - Fedora-43
          - Fedora-44
          - Arch

# Serialize version-tag uploads. Independent manual runs use separate drafts.
concurrency:
  group: anland-release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_SHELL: ${{ inputs.build_shell }}
  BUILD_WAYLAND: ${{ inputs.build_wayland }}
  BUILD_ROOTFS: ${{ inputs.build_rootfs }}
  ROOTFS_TARGET: ${{ inputs.rootfs_target }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.plan.outputs.shell }}
      wayland: ${{ steps.plan.outputs.wayland }}
      rootfs: ${{ steps.plan.outputs.rootfs }}
      build_plan: ${{ steps.plan.outputs.build_plan }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: python3 scripts/ci/release.py plan

  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        if: needs.plan.outputs.wayland == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Release planning and packaging regression tests
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
      - name: Desktop launcher regression tests
        if: needs.plan.outputs.shell == 'true'
        run: python3 tests/desktop_session_probe_test.py
      - name: Session startup regression tests
        if: needs.plan.outputs.wayland == 'true' || needs.plan.outputs.rootfs == 'true'
        run: python3 tests/session_startup_test.py
      - name: Linux appearance policy regression tests
        run: python3 tests/appearance_sync_test.py
      - name: Window geometry and desktop metadata regression tests
        if: needs.plan.outputs.wayland == 'true'
        run: |
          mkdir -p /tmp/anland-java-tests
          javac -d /tmp/anland-java-tests \
            app/libawl/src/main/java/com/anlandnext/awl/WindowSafeArea.java tests/WindowSafeAreaTest.java
          java -cp /tmp/anland-java-tests com.anlandnext.awl.WindowSafeAreaTest
          javac -d /tmp/anland-java-tests \
            app/libawl/src/main/java/com/anlandnext/awl/TaskIdentity.java \
            app/libawl/src/main/java/com/anlandnext/awl/WindowScope.java tests/TaskIdentityTest.java
          java -cp /tmp/anland-java-tests com.anlandnext.awl.TaskIdentityTest
          g++ -std=c++17 -Wall -Wextra -Werror -I services/waylandbridge \
            services/waylandbridge/desktop_metadata.cpp tests/desktop_metadata_test.cpp \
            -o /tmp/anland-metadata-test
          /tmp/anland-metadata-test
      - name: Check selected signing secrets before creating a draft
        env:
          SHELL_SELECTED: ${{ needs.plan.outputs.shell }}
          WAYLAND_SELECTED: ${{ needs.plan.outputs.wayland }}
          SHELL_KEY: ${{ secrets.ANLAND_SHELL_KEYSTORE_BASE64 }}
          WAYLAND_KEY: ${{ secrets.ANLAND_WAYLAND_KEYSTORE_BASE64 }}
          SHELL_CONFIG: ${{ secrets.ANLAND_SHELL_SIGNING_CONFIG }}
          WAYLAND_CONFIG: ${{ secrets.ANLAND_WAYLAND_SIGNING_CONFIG }}
        run: |
          if [[ "$SHELL_SELECTED" == true && ( -z "$SHELL_KEY" || -z "$SHELL_CONFIG" ) ]]; then
            echo 'Missing Shell signing Secrets; sync the repository keystore first' >&2
            exit 1
          fi
          if [[ "$WAYLAND_SELECTED" == true && ( -z "$WAYLAND_KEY" || -z "$WAYLAND_CONFIG" ) ]]; then
            echo 'Missing Wayland signing Secrets; sync the repository keystore first' >&2
            exit 1
          fi

  prepare-release:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the shared draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/release.py prepare

  shell:
    needs: [plan, prepare-release]
    if: needs.plan.outputs.shell == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/app-shell.yml
    with:
      build_plan: ${{ needs.plan.outputs.build_plan }}
    secrets:
      signing_key: ${{ secrets.ANLAND_SHELL_KEYSTORE_BASE64 }}
      signing_config: ${{ secrets.ANLAND_SHELL_SIGNING_CONFIG }}

  wayland:
    needs: [plan, prepare-release]
    if: needs.plan.outputs.wayland == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/app-wayland.yml
    with:
      build_plan: ${{ needs.plan.outputs.build_plan }}
    secrets:
      signing_key: ${{ secrets.ANLAND_WAYLAND_KEYSTORE_BASE64 }}
      signing_config: ${{ secrets.ANLAND_WAYLAND_SIGNING_CONFIG }}

  rootfs:
    needs: [plan, prepare-release]
    if: needs.plan.outputs.rootfs == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/rootfs.yml
    with:
      build_plan: ${{ needs.plan.outputs.build_plan }}

  finalize-release:
    needs: [plan, prepare-release, shell, wayland, rootfs]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify selected components and finalize the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/release.py finalize
